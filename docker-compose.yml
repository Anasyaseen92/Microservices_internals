services:
  auth-db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: auth_db }
    ports: ["5433:5432"]
    volumes: ["auth-db-data:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres -d auth_db"], interval: 5s, timeout: 5s, retries: 10 }
  product-db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: product_db }
    ports: ["5434:5432"]
    volumes: ["product-db-data:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres -d product_db"], interval: 5s, timeout: 5s, retries: 10 }
  order-db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: order_db }
    ports: ["5435:5432"]
    volumes: ["order-db-data:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres -d order_db"], interval: 5s, timeout: 5s, retries: 10 }

  auth-migrate:
    build: ./services/auth-service
    command: sh -c "pnpm prisma:migrate:deploy && pnpm prisma:seed"
    environment: { DATABASE_URL: postgresql://postgres:postgres@auth-db:5432/auth_db?schema=public }
    depends_on: { auth-db: { condition: service_healthy } }
  product-migrate:
    build: ./services/product-service
    command: sh -c "pnpm prisma:migrate:deploy && pnpm prisma:seed"
    environment: { DATABASE_URL: postgresql://postgres:postgres@product-db:5432/product_db?schema=public }
    depends_on: { product-db: { condition: service_healthy } }
  order-migrate:
    build: ./services/order-service
    command: sh -c "pnpm prisma:migrate:deploy && pnpm prisma:seed"
    environment: { DATABASE_URL: postgresql://postgres:postgres@order-db:5432/order_db?schema=public }
    depends_on: { order-db: { condition: service_healthy } }

  auth-service:
    build: ./services/auth-service
    ports: ["4001:4001"]
    environment: { DATABASE_URL: postgresql://postgres:postgres@auth-db:5432/auth_db?schema=public, JWT_SECRET: development-secret-change-me }
    depends_on: { auth-migrate: { condition: service_completed_successfully } }
    healthcheck: { test: ["CMD", "node", "-e", "fetch('http://localhost:4001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"], interval: 5s, timeout: 5s, retries: 10 }
  product-service:
    build: ./services/product-service
    ports: ["4002:4002"]
    environment: { DATABASE_URL: postgresql://product-db:5432/product_db?schema=public }
    depends_on: { product-migrate: { condition: service_completed_successfully } }
    healthcheck: { test: ["CMD", "node", "-e", "fetch('http://localhost:4002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"], interval: 5s, timeout: 5s, retries: 10 }
  inventory-service:
    build: ./services/inventory-service
    ports: ["4003:4003"]
    healthcheck: { test: ["CMD", "node", "-e", "fetch('http://localhost:4003/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"], interval: 5s, timeout: 5s, retries: 10 }
  cart-service:
    build: ./services/cart-service
    ports: ["4004:4004"]
    environment: { PRODUCT_SERVICE_URL: http://product-service:4002, JWT_SECRET: development-secret-change-me }
    depends_on: { product-service: { condition: service_healthy } }
    healthcheck: { test: ["CMD", "node", "-e", "fetch('http://localhost:4004/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"], interval: 5s, timeout: 5s, retries: 10 }
  order-service:
    build: ./services/order-service
    ports: ["4005:4005"]
    environment: { DATABASE_URL: postgresql://order-db:5432/order_db?schema=public, JWT_SECRET: development-secret-change-me, CART_SERVICE_URL: http://cart-service:4004, PRODUCT_SERVICE_URL: http://product-service:4002, INVENTORY_SERVICE_URL: http://inventory-service:4003, PAYMENT_SERVICE_URL: http://payment-service:4006, NOTIFICATION_SERVICE_URL: http://notification-service:4007 }
    depends_on: { order-migrate: { condition: service_completed_successfully }, cart-service: { condition: service_healthy }, inventory-service: { condition: service_healthy }, payment-service: { condition: service_healthy }, notification-service: { condition: service_healthy } }
    healthcheck: { test: ["CMD", "node", "-e", "fetch('http://localhost:4005/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"], interval: 5s, timeout: 5s, retries: 10 }
  payment-service:
    build: ./services/payment-service
    ports: ["4006:4006"]
    healthcheck: { test: ["CMD", "node", "-e", "fetch('http://localhost:4006/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"], interval: 5s, timeout: 5s, retries: 10 }
  notification-service:
    build: ./services/notification-service
    ports: ["4007:4007"]
    healthcheck: { test: ["CMD", "node", "-e", "fetch('http://localhost:4007/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"], interval: 5s, timeout: 5s, retries: 10 }
  api-gateway:
    build: ./services/api-gateway
    ports: ["4000:4000"]
    environment: { FRONTEND_ORIGIN: http://localhost:3000, AUTH_SERVICE_URL: http://auth-service:4001, PRODUCT_SERVICE_URL: http://product-service:4002, INVENTORY_SERVICE_URL: http://inventory-service:4003, CART_SERVICE_URL: http://cart-service:4004, ORDER_SERVICE_URL: http://order-service:4005, PAYMENT_SERVICE_URL: http://payment-service:4006, NOTIFICATION_SERVICE_URL: http://notification-service:4007 }
    depends_on: { auth-service: { condition: service_healthy }, product-service: { condition: service_healthy }, cart-service: { condition: service_healthy }, order-service: { condition: service_healthy } }
    healthcheck: { test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"], interval: 5s, timeout: 5s, retries: 10 }
  web:
    build: ./apps/web
    ports: ["3000:3000"]
    environment: { NEXT_PUBLIC_API_GATEWAY_URL: http://localhost:4000 }
    depends_on: { api-gateway: { condition: service_healthy } }

volumes:
  auth-db-data:
  product-db-data:
  order-db-data:
